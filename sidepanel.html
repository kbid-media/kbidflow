<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>KbidFlow</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
<header>
  <div class="brand"><span class="bolt">⚡</span> KbidFlow <span id="version" class="small muted"></span></div>
  <div id="conn" class="pill off">sem aba do Flow</div>
</header>

<section class="card" id="info">
  <div class="row small">
    <span id="countVideos">– vídeos</span>
    <span id="countGen">– gerando</span>
  </div>
  <div id="statusText" class="status">Abra um projeto no Google Flow.</div>
  <div class="bar"><div id="bar"></div></div>
</section>

<section class="card">
  <p class="hint">Baixa os vídeos do projeto aberto, um de cada vez, em <b id="qualityHint">1080p</b>. Deixe a aba do Flow na frente enquanto baixa.</p>
  <div class="pickbox">
    <label class="check"><input id="pickMode" type="checkbox" /> Escolher os vídeos (aparece uma caixinha em cada um)</label>
    <div class="row small">
      <span id="pickedCount" class="muted">desligado: baixa todos</span>
      <span>
        <button id="pickAll" class="link">marcar visíveis</button>
        <button id="pickClear" class="link">limpar</button>
      </span>
    </div>
  </div>
  <label class="check"><input id="skipSaved" type="checkbox" checked /> Pular o que eu já baixei neste projeto</label>
  <div class="actions">
    <button id="btnDl" class="primary">Baixar vídeos</button>
    <button class="stop">Parar</button>
  </div>
</section>

<details class="card" id="cfg">
  <summary>Ajustes</summary>
  <div class="grid2">
    <div>
      <label>Qualidade do vídeo</label>
      <select id="quality">
        <option value="1080p">1080p (upscale)</option>
        <option value="720p">720p (original)</option>
        <option value="4K">4K (upscale, gasta créditos)</option>
        <option value="270p">GIF 270p</option>
      </select>
    </div>
    <div>
      <label>Quantos (0 = todos)</label>
      <input id="limit" type="number" min="0" value="0" />
    </div>
    <div>
      <label>Pasta em Downloads</label>
      <input id="folder" type="text" value="KbidFlow" />
    </div>
    <div>
      <label>Prefixo do arquivo</label>
      <input id="prefix" type="text" value="" placeholder="ex.: v3_" />
    </div>
    <div>
      <label>Começar numeração em</label>
      <input id="startNumber" type="number" min="1" value="1" />
    </div>
    <div>
      <label>Espera máx. por vídeo (min)</label>
      <input id="timeoutMin" type="number" min="1" max="60" value="10" />
    </div>
    <div>
      <label>Pausa entre downloads (s)</label>
      <input id="gapSec" type="number" min="0" max="60" value="3" />
    </div>
    <div>
      <label>Qualidade da imagem</label>
      <select id="imageQuality">
        <option value="2K">2K</option>
        <option value="1K">1K</option>
        <option value="4K">4K</option>
      </select>
    </div>
  </div>
  <label class="check"><input id="includeImages" type="checkbox" /> Baixar também as imagens</label>
  <label class="check"><input id="fallback720" type="checkbox" /> Se o 1080p continuar bloqueado (~8 min), baixar em 720p em vez de pular</label>
  <label class="check"><input id="allowCredits" type="checkbox" /> Permitir confirmar quando o Flow pedir créditos (ex.: 4K)</label>
  <button id="btnClearHist" class="link">Esquecer o que já foi baixado neste projeto</button>
</details>

<section class="card">
  <div class="row"><label>Registro</label><button id="clearLog" class="link">limpar</button></div>
  <div id="log"></div>
</section>

<script src="sidepanel.js"></script>
</body>
</html>
